ServerName 192.168.10.55
Listen 80
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
TimeOut 60
LimitRequestBody 0

<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 4
    MaxConnectionsPerChild 0
</IfModule>

DocumentRoot "/var/www/html"
<Directory "/var/www/html">
    Options -Indexes
    AllowOverride None
    Require all granted
    <Files "flag.txt">
        Require all denied
    </Files>
</Directory>

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" pid=%P" combined
CustomLog /var/log/apache2/access.log combined
ErrorLog /var/log/apache2/error.log
LogLevel warn
