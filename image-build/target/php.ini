[PHP]
engine = On
memory_limit = 128M
post_max_size = 16M
upload_max_filesize = 8M
max_file_uploads = 20
max_input_vars = 1000
max_input_nesting_level = 64
default_socket_timeout = 60
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
error_log = /var/log/apache2/php-error.log
expose_php = On

[Session]
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.use_strict_mode = 0

; This is the deliberately vulnerable research profile. It is not a claim that
; Content-Length >= memory_limit is an exploit. Multipart startup and allocator
; state must be investigated using actual target evidence.
