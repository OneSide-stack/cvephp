name: Build reproducible guest images

on:
  push:
    branches:
      - arena/5befbcf9-cvephp
    paths:
      - 'image-build/**'
      - 'scripts/*asset*'
      - 'scripts/prepare-runtime.mjs'
      - 'src/lib/**'
      - 'tests/**'
      - 'playwright.guest.config.ts'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      build_patched:
        description: Build the PHP 8.2.35 comparison image
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: guest-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install host utilities
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl ca-certificates tar gzip
      - name: Install JavaScript build utilities
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reuse images when provisioning inputs are unchanged
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          echo 'reuse=false' >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then exit 0; fi
          if ! git diff --quiet "$BEFORE" HEAD -- image-build scripts/prepare-runtime.mjs scripts/generate-asset-manifest.mjs scripts/verify-assets.mjs public/v86 public/lab-assets/manifest.json; then exit 0; fi
          previous="$(gh run list --workflow build-images.yml --branch "$GITHUB_REF_NAME" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$previous" ]; then exit 0; fi
          rm -rf /tmp/cyber-range-reused-images
          if ! gh run download "$previous" --name cyber-range-guest-images --dir /tmp/cyber-range-reused-images; then
            echo '::warning::Previous image artifact is unavailable; rebuilding from source.'
            exit 0
          fi
          if [ ! -s /tmp/cyber-range-reused-images/public/lab-assets/attacker-tinycore-11.0.iso ] || [ ! -s /tmp/cyber-range-reused-images/public/lab-assets/target-php-8.2.34.iso ]; then
            echo '::warning::Previous artifact lacks required guests; rebuilding from source.'
            exit 0
          fi
          cp -a /tmp/cyber-range-reused-images/public/. public/
          if [ -f /tmp/cyber-range-reused-images/image-checksums.txt ]; then cp /tmp/cyber-range-reused-images/image-checksums.txt .; fi
          echo "Reusing checksummed guest images from run $previous; provisioning inputs are unchanged."
          echo 'reuse=true' >> "$GITHUB_OUTPUT"
      - name: Build Alpine PHP 8.2.34 target
        if: steps.reuse.outputs.reuse != 'true'
        run: bash image-build/build-target.sh 8.2.34 target-php-8.2.34.iso
      - name: Build TinyCore graphical attacker
        if: steps.reuse.outputs.reuse != 'true'
        run: bash image-build/build-attacker.sh
      - name: Generate and verify asset manifest
        run: node scripts/prepare-runtime.mjs && node scripts/generate-asset-manifest.mjs && node scripts/verify-assets.mjs
      - name: Record artifact inventory
        run: sha256sum public/lab-assets/*.iso public/v86/*.bin public/v86/*.wasm > image-checksums.txt && ls -lh public/lab-assets/*.iso
      - name: Upload verified guest images
        uses: actions/upload-artifact@v4
        with:
          name: cyber-range-guest-images
          path: |
            public/lab-assets/*.iso
            public/lab-assets/manifest.json
            public/v86/*.bin
            public/v86/*.wasm
            image-checksums.txt
          retention-days: 30
      - name: Prepare registry-packaged Chromium
        shell: bash
        run: |
          mkdir -p /tmp/cyber-range-chromium
          cd /tmp/cyber-range-chromium
          npm init -y >/dev/null
          npm install @sparticuz/chromium@153.0.0 --no-audit --no-fund
          rm -f /tmp/chromium
          rm -rf /tmp/al2023 /tmp/fonts /tmp/swiftshader
          AWS_EXECUTION_ENV=nodejs22.x node --input-type=module -e 'import Chromium from "@sparticuz/chromium"; await Chromium.executablePath();'
      - name: Real dual-guest browser acceptance
        run: npm run test:e2e:guest
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /tmp/chromium
          LD_LIBRARY_PATH: /tmp/al2023/lib
      - name: Print guest acceptance failure context
        if: failure()
        run: |
          if [ -d test-results ]; then
            find test-results -type f -name 'error-context.md' -print -exec sed -n '1,240p' {} \;
          fi
      - name: Build optional Alpine PHP 8.2.35 comparison
        id: patched
        if: steps.reuse.outputs.reuse != 'true' && (github.event_name == 'push' || inputs.build_patched)
        continue-on-error: true
        run: bash image-build/build-target.sh 8.2.35 target-php-8.2.35.iso
      - name: Clean optional comparison scratch
        if: always() && steps.reuse.outputs.reuse != 'true' && (github.event_name == 'push' || inputs.build_patched)
        run: |
          mkdir -p .image-build-work/target-8.2.35
          docker run --rm --platform linux/amd64 -v "$PWD/.image-build-work/target-8.2.35:/work" alpine:3.22.1 \
            sh -c 'rm -rf /work/rootfs /work/iso /work/base /work/rootfs.tar /work/rootfs.cpio /work/rootfs-files.bin /work/initramfs-lts'
          rm -rf .image-build-work/target-8.2.35
          docker image rm cyber-range-target:8.2.35 >/dev/null 2>&1 || true
      - name: Refresh manifest after optional comparison
        if: steps.reuse.outputs.reuse != 'true' && (github.event_name == 'push' || inputs.build_patched)
        run: node scripts/generate-asset-manifest.mjs && node scripts/verify-assets.mjs
      - name: Record final artifact inventory
        if: steps.reuse.outputs.reuse != 'true' && (github.event_name == 'push' || inputs.build_patched)
        run: |
          sha256sum public/lab-assets/*.iso public/v86/*.bin public/v86/*.wasm > image-checksums.txt
          ls -lh public/lab-assets/*.iso
          if [ "${{ steps.patched.outcome }}" = failure ]; then
            echo 'Optional PHP 8.2.35 comparison was not produced; required guest acceptance already ran.' >> image-checksums.txt
            echo '::warning::Optional PHP 8.2.35 comparison failed; see its build log. Required images and acceptance are independent.'
          fi
      - name: Upload final guest images and manifest
        if: steps.reuse.outputs.reuse != 'true' && (github.event_name == 'push' || inputs.build_patched)
        uses: actions/upload-artifact@v4
        with:
          name: cyber-range-guest-images
          overwrite: true
          path: |
            public/lab-assets/*.iso
            public/lab-assets/manifest.json
            public/v86/*.bin
            public/v86/*.wasm
            image-checksums.txt
          retention-days: 30
      - name: Upload guest acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyber-range-guest-acceptance
          path: |
            test-results/
            playwright-guest-report/
          if-no-files-found: ignore
          retention-days: 30
