name: Frontend and guest-tool tests

on:
  push:
    branches:
      - arena/5befbcf9-cvephp
    paths:
      - 'src/**'
      - 'tests/**'
      - 'image-build/attacker/*.py'
      - 'image-build/tests/**'
      - 'public/sw.js'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit and guest-tool tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Prepare registry-packaged Chromium
        shell: bash
        run: |
          mkdir -p /tmp/cyber-range-chromium
          cd /tmp/cyber-range-chromium
          npm init -y >/dev/null
          npm install @sparticuz/chromium@153.0.0 --no-audit --no-fund
          rm -f /tmp/chromium
          rm -rf /tmp/al2023 /tmp/fonts /tmp/swiftshader
          AWS_EXECUTION_ENV=nodejs22.x node --input-type=module -e 'import Chromium from "@sparticuz/chromium"; await Chromium.executablePath();'
      - name: Browser acceptance tests (missing-image path)
        run: npm run test:e2e
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /tmp/chromium
          LD_LIBRARY_PATH: /tmp/al2023/lib
