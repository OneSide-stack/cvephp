name: Frontend and guest-tool tests

on:
  push:
    branches:
      - arena/5befbcf9-cvephp
    paths:
      - 'src/**'
      - 'tests/**'
      - 'image-build/attacker/*.py'
      - 'image-build/tests/**'
      - 'public/sw.js'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit and guest-tool tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests (missing-image path)
        run: npm run test:e2e
