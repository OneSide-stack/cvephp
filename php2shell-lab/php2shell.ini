; ============================================================================
;  PHP2Shell lab — explicit PHP runtime configuration
;  Installed at /usr/local/etc/php/conf.d/90-php2shell.ini
; ----------------------------------------------------------------------------
;  Mirrors a realistic corporate staging/production SaaS box: errors visible,
;  generous upload limits, UTC everywhere. Every knob below is relevant when
;  analysing CVE-2026-109618 / CVE-2026-109619 behaviour.
; ============================================================================

[PHP]
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
upload_max_filesize = 16M
post_max_size = 24M

[Error handling]
; developer-friendly posture: surface engine behaviour during analysis
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

[Misc]
expose_php = On
date.timezone = UTC
; cgi.fix_pathinfo — intentionally left at the PHP default (1); it matters
; for PATH_INFO handling studies. The Runtime Environment view of the app
; displays the live value.
