# ============================================================================
#  Nimbus Analytics — PHP2Shell analysis lab VM
#  nginx master configuration (all-in-one container)
#
#  Traffic flow:
#      client :80 ──► nginx ──(FastCGI 127.0.0.1:9000)──► PHP-FPM 8.4.26
#
#  This is the complete, standalone nginx configuration — it replaces the
#  Alpine default /etc/nginx/nginx.conf entirely.
# ============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # server_tokens off;   # left ON (default) so the lab can fingerprint the
                          # front door during analysis; flip off to harden.

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_names_hash_bucket_size 128;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log main;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # security headers a corporate front door would set
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── PHP-FPM backend — supervised in the same container ("VM") ──
    upstream php-fpm-backend {
        server 127.0.0.1:9000;
    }

    server {
        listen      80 default_server;
        server_name _;

        root   /var/www/html;
        index  index.php index.html;
        charset utf-8;

        # matches post_max_size in php2shell.ini — keeps upload-based
        # testing of the runtime friction-free
        client_max_body_size 24m;

        # plain liveness endpoint served by nginx itself (no PHP involved)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── .php execution paths → PHP-FPM :9000 ─────────────────────────
        # Classic corporate pattern: SCRIPT_FILENAME derived from
        # $document_root with no `try_files $uri =404` existence guard —
        # the historically bug-prone setup this lab deliberately replicates.
        location ~ \.php$ {
            fastcgi_pass   php-fpm-backend;
            fastcgi_index  index.php;
            include        /etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout  60s;
            fastcgi_buffers 16 16k;
        }

        # deny dotfiles (.git, .env, …)
        location ~ /\. {
            deny all;
        }
    }
}
