; ============================================================================
;  PHP2Shell analysis lab VM — process supervision
; ----------------------------------------------------------------------------
;  One container behaves like one "VM": supervisord is PID 1 and brings up
;  PHP-FPM first (priority 5), then nginx (priority 10). Logs from both
;  daemons are forwarded to the container's stdout/stderr.
;
;  Installed at /etc/supervisor/conf.d/supervisord.conf and started with:
;      /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
; ============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=8MB
logfile_backups=2
loglevel=info
pidfile=/var/run/supervisord.pid

; control socket — enables `docker exec <ctr> supervisorctl status`
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── PHP-FPM 8.4.26 (vulnerable runtime — starts first) ─────────────────────
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=5
autostart=true
autorestart=true
startretries=5
startsecs=2
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── nginx (front door on :80, proxies .php to 127.0.0.1:9000) ───────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
startretries=5
startsecs=2
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
